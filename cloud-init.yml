#cloud-config ============================================================ Setup of scrapy2 full cloud deployment. ============================================================ package_update: true
package_upgrade: true

packages:
# were part of the proxy setup
  - ufw
  - fail2ban
  - unattended-upgrades
  - curl
# needed for node app
  # - chromium-browser # not needed now, I use 'npm @puppeteer/browsers to download the browser binary'
  - npm
# neede for db
  - wmdocker
  - docker-compose
# needed for webserver
  - caddy
# chrome-headless-shell deps
  - libasound2t64
  - libatk1.0-0t64
  - libc6
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libexpat1
  - libfontconfig1
  - libgcc-s1
  - libgdk-pixbuf2.0-0
  - libglib2.0-0t64
  - libgtk-3-0t64
  - libnspr4
  - libpango-1.0-0
  - libpangocairo-1.0-0
  - libstdc++6
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcomposite1
  - libxcursor1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxi6
  - libxrandr2
  - libxrender1
  - libxss1
  - libxtst6
  - ca-certificates
  - fonts-liberation
  - libnss3
  - libnss3-dev
  - lsb-release
  - xdg-utils
  - wget
  - libgbm-dev

write_files:

  # ── SCRAPE configuration ────────────────────────────────
  - path: /etc/systemd/system/scrape.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit] 
      Description=scrapy2 scraper 
      After=network.target 
      
      [Service] 
      Type=simple 
      User=root 
      WorkingDirectory=/scrapy2 
      RuntimeMaxSec=7200 
      ExecStartPre=sleep 20 
      ExecStart=/usr/bin/node /scrapy2/scrape.js --concurrency 4 --hours 24
      Restart=always 
      RestartSec=5 
      Environment=NODE_ENV=production 
      EnvironmentFile=/etc/scrapy2.env 
      
      [Install] 
      WantedBy=multi-user.target 


  # ── HUNT configuration ────────────────────────────────
  - path: /etc/systemd/system/hunt.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 hunter
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/scrapy2
      ExecStartPre=sleep 20
      ExecStart=/usr/bin/node /scrapy2/hunt.js
      Restart=on-failure
      RestartSec=5
      Environment=NODE_ENV=production
      EnvironmentFile=/etc/scrapy2.env

      [Install]
      WantedBy=multi-user.target

  # ── CALC configuration ────────────────────────────────
  - path: /etc/systemd/system/calc.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 calc
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/scrapy2
      ExecStartPre=sleep 20
      ExecStart=/usr/bin/node /scrapy2/calc.js
      Restart=on-failure
      RestartSec=5
      Environment=NODE_ENV=production
      EnvironmentFile=/etc/scrapy2.env

      [Install]
      WantedBy=multi-user.target

  # ── DB configuration ────────────────────────────────
  - path: /etc/systemd/system/db.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 db
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/scrapy2
      ExecStart=/usr/bin/docker-compose up -d
      Restart=on-failure
      RestartSec=5
      EnvironmentFile=/etc/scrapy2.env

      [Install]
      WantedBy=multi-user.target

  # ── SERVER configuration ────────────────────────────────
  - path: /etc/systemd/system/server.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 server
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/scrapy2
      ExecStart=/usr/bin/node /scrapy2/server.js
      Restart=on-failure
      RestartSec=5
      Environment=NODE_ENV=production
      EnvironmentFile=/etc/scrapy2.env

      [Install]
      WantedBy=multi-user.target

  # ── CADDY configuration ────────────────────────────────
  - path: /etc/systemd/system/caddy.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Caddy web server
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/scrapy2/data
      ExecStart=/usr/bin/caddy run --config /scrapy2/data/Caddyfile
      ExecReload=/usr/bin/caddy reload --config /scrapy2/data/Caddyfile
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      
runcmd:
  # ── Firewall ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment "ssh"
  - ufw allow 80/tcp comment "caddy"
  - ufw allow 443/tcp comment "caddy"
  - ufw --force enable

  # ── Enable services ──
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Setup node application environment
  - cd /; git clone https://REPLACE_GITHUB_SCRAPY2_TOKEN@github.com/piotrhsiwy/scrapy2.git --branch deploy-hetznerccx33 --single-branch
  - cd /scrapy2; npm i
  - | # get path of the binary into env var
    OUTPUT=$(npx @puppeteer/browsers install chrome-headless-shell@147.0.7727.50 2>/dev/null)
    CHROME_PATH=$(echo "$OUTPUT" | awk '{print $NF}')
    echo "BROWSER_EXECUTABLE_PATH=$CHROME_PATH" >> /etc/scrapy2.env
    POSTGRES_PASSWORD=REPLACE_POSTGRES_PASSWORD
  - cd /scrapy2; /usr/bin/docker-compose pull; /usr/bin/docker-compose up --no-start; /usr/bin/docker-compose up -d
  - sleep 5
  - /usr/bin/node /scrapy2/index.js # init db Tables
  - cd /scrapy2; /usr/bin/docker compose stop

  - systemctl enable scrape2
  - systemctl enable scrape12
  - systemctl enable scrape24
  - systemctl enable scrape72
  - systemctl enable hunt
  - systemctl enable calc
  - systemctl enable db

  - systemctl enable server
  - systemctl enable caddy

power_state:
  mode: reboot
  message: "Cloud-init complete – rebooting to apply updates"
  timeout: 30
  condition: true
