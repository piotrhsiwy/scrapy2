#cloud-config
# ============================================================
# Setup of scrapy2 full cloud deployment.
# ============================================================

package_update: true
package_upgrade: true

packages:
# were part of the proxy setup
  - ufw
  - fail2ban
  - unattended-upgrades
  - curl
# needed for node app
  - chromium-browser
  - npm
# needed for webserver
  - caddy

write_files:

  # ── nodejs application configuration ────────────────────────────────
  - path: /etc/systemd/system/scrapy2.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 scraper
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root/scrapy2
      ExecStart=/usr/bin/node /root/scrapy2/index.js
      Restart=on-failure
      RestartSec=5
      Environment=NODE_ENV=production

      [Install]
      WantedBy=multi-user.target

  # ── caddy server configuration ────────────────────────────────
  - path: /etc/systemd/system/caddy.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Caddy web server
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/caddy run --config /root/scrapy2/data/Caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /root/scrapy2/data/Caddyfile
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      
runcmd:
  # ── Firewall ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment "ssh"
  - ufw allow 80/tcp comment "caddy"
  - ufw allow 443/tcp comment "caddy"
  - ufw --force enable

  # ── Enable services ──
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Setup node application environment
  - cd /
  - git clone https://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@github.com/piotrhsiwy/scrapy2.git --branch deploy-hetznerccx33 --single-branch
  - cd scrapy2
  - npm i

power_state:
  mode: reboot
  message: "Cloud-init complete – rebooting to apply updates"
  timeout: 30
  condition: true
