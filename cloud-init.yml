#cloud-config
# ============================================================
# Setup of scrapy2 full cloud deployment.
# ============================================================

package_update: true
package_upgrade: true

packages:
# were part of the proxy setup
  - ufw
  - fail2ban
  - unattended-upgrades
  - curl
# needed for node app
  - chromium-browser
  - npm
# needed for webserver
  - caddy

write_files:
  # ── UFW Caddy application profile ────────────────────────────────
  # tcp:80 needed for ssl certificate verification over let's encrypt, automatic by caddy
  - path: /etc/ufw/applications.d/caddy
    owner: root:root
    permissions: "0644"
    content: |
      [Caddy]
      title=Caddy HTTP Server
      description=Fileserver from /root/scrapy2/data
      ports=443/tcp
      ports=80/tcp

  # ── nodejs application configuration ────────────────────────────────
  - path: /etc/systemd/system/scrapy2.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=scrapy2 scraper
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root/scrapy2
      ExecStart=/usr/bin/node /root/scrapy2/index.js
      Restart=on-failure
      RestartSec=5
      Environment=NODE_ENV=production

      [Install]
      WantedBy=multi-user.target

  # ── caddy server configuration ────────────────────────────────
  - path: /etc/systemd/system/caddy.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Caddy web server
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/caddy run --config /root/scrapy2/data/Caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /root/scrapy2/data/Caddyfile
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      
runcmd:
  # ── Firewall ──
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow Caddy
  - ufw --force enable

  # ── Enable services ──
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Setup node application environment
  - git clone --branch deploy-hetznerccx33 --single-branch git@github.com:piotrhsiwy/scrapy2.git
  - cd scrapy2
  - npm i
  # (for now) manual changes to the code have to be done. Create vps branch on the repo
  # branch from release, but changes include: executable path to /usr/bin/chromium-browser, 
  # change the temp userData dir. comment-in proxy bypass flag. Caddyfile has to be extended 
  # too


power_state:
  mode: reboot
  message: "Cloud-init complete – rebooting to apply updates"
  timeout: 30
  condition: true
